services:
  utm-egais:
    build:
      context: .
      args:
        UTM_DEB: u-trans-4.2.0-2644-i386.deb
    container_name: utm-egais
    restart: unless-stopped
    ports:
      - "8080:8080"
    devices:
      - /dev/bus/usb:/dev/bus/usb
    device_cgroup_rules:
      - "c 189:* rmw"
    volumes:
      # UTM creates its Derby database inside transportDB on its first start.
      # Mount the parent so Docker does not pre-create transportDB as an empty
      # volume mount (Derby rejects that state).
      - utm-transport:/opt/utm/transport
      - utm-logs:/opt/utm/l

volumes:
  utm-transport:
  utm-logs:
