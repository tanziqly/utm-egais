[program:pcscd]
command=/usr/sbin/pcscd --foreground --disable-polkit
priority=10
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:utm]
command=/opt/utm/transport/bin/transport.sh
directory=/opt/utm/transport
priority=20
autostart=true
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
